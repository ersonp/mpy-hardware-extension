[package]
name = "blockless-installer-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# step-level logging for the diagnostics bundle's logs/ (ARCHITECTURE §9).
# No-op without a subscriber installed, so this crate's own tests never need
# one; the CLI installs the real file appender (see cli/Cargo.toml).
tracing = "0.1"
# blocking + rustls-tls: no async runtime to thread through the CLI, no system
# OpenSSL dependency. Honors HTTPS_PROXY/HTTP_PROXY env by default (§11).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# diagnostics bundle: a plain container for logs/state/manifest, not
# performance-sensitive, so deflate only (skip bzip2/zstd/aes backends).
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# capture ops.rs's tracing output in a test-scoped subscriber, to prove each
# op actually logs its steps rather than just compiling the macro calls.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
